[package]
name = "phx"
version = "0.1.0"
edition = "2021"
# Specify a build script (to dynamically set the binary name)
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.2"
serde_derive = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"   # For handling async streams
indicatif = "0.17"     # Optional: progress bars
git2 = "0.16"

[[bin]]
name = "phx"
path = "src/main.rs"

[profile.release]
